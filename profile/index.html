<!doctype html>

  <link rel="icon" href="../logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            nexblue: '#0878C9',
            nexgreen: '#67B900',
            nexdark: '#183246'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-900">
  <header class="bg-white border-b border-slate-200 sticky top-0 z-20">
    <div class="max-w-6xl mx-auto px-5 py-4 flex items-center justify-between gap-4">
      <a href="/" class="flex items-center gap-3">
        <img src="../logo.png" alt="Nexura Dynamics" class="h-12 w-auto">

      <div class="flex items-center gap-3">
        <a href="/" class="hidden sm:inline-flex px-4 py-2 rounded-xl border border-slate-200 font-semibold hover:border-nexblue hover:text-nexblue transition">Back to Website</a>
        <a href="Nexura_Dynamics_Company_Profile.pdf" download class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-gradient-to-r from-nexblue to-nexgreen text-white font-bold shadow-sm hover:opacity-90 transition">

  </header>

  <main class="max-w-6xl mx-auto px-5 py-8">

    <div class="bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden">
      <object data="Nexura_Dynamics_Company_Profile.pdf#view=FitH" type="application/pdf" class="w-full" style="height:78vh; min-height:650px;">

      <span>For enquiries: <a class="font-semibold text-nexblue" href="mailto:info@nexuradynamics.com">info@nexuradynamics.com</a></span>
